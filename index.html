<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6th Grade Math Review | Mission Mastery</title><style>
:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#17345b;background:#edf5ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#173f79,#2979b8);color:white;padding:28px 5%}header h1{margin:0;font-size:clamp(26px,4vw,40px)}header p{margin:8px 0 0;opacity:.9}.wrap{max-width:1120px;margin:auto;padding:24px 16px}.panel{background:white;border:1px solid #c8ddef;border-radius:16px;padding:20px;box-shadow:0 5px 15px #19467710}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}.tabs,.levels{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border-radius:10px;padding:10px 13px;border:1px solid #a9c9e4;background:white;color:#194577;font-weight:650}button:hover{background:#e5f3ff}button.active{background:#1b609c;color:white;border-color:#1b609c}.stats{font-weight:650;margin:12px 0 18px}.track{height:12px;border-radius:20px;background:#dceaf5;overflow:hidden}.bar{height:100%;width:0;background:#31a978;transition:width .2s}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{background:white;border:1px solid #c9ddec;border-radius:15px;padding:20px;display:flex;flex-direction:column;gap:15px;min-height:240px}.top{display:flex;align-items:center;justify-content:space-between}.num{background:#d4efff;border-radius:50%;height:40px;width:40px;display:grid;place-items:center;font-weight:800}.tag{font-size:12px;letter-spacing:.06em;font-weight:800;text-transform:uppercase;padding:5px 9px;border-radius:30px;background:#e9f1fb}.tag.spicy{background:#ffe0d8;color:#a23e28}.tag.medium{background:#fff0c8;color:#855c00}.tag.mild{background:#ddf6e5;color:#216c43}.question{font-size:19px;line-height:1.5;flex:1;white-space:pre-line}.answer{background:#ecf8ef;color:#155631;border-radius:10px;padding:13px;line-height:1.45}.actions{display:flex;gap:8px;flex-wrap:wrap}.done{background:#ecf8ef;border-color:#91caa7;color:#19613c}.footer{text-align:center;color:#607994;padding:30px 10px}#empty{display:none;padding:24px;text-align:center}@media print{header{background:white;color:black}.toolbar button,.actions,.footer{display:none}.card{break-inside:avoid}.answer{display:none!important}}
</style></head><body><header><h1>🚀 Mission Mastery: 6th Grade Math</h1><p>Choose a category. Choose your challenge. Show your thinking. Check your answer.</p></header><main class="wrap"><section class="panel"><div class="toolbar"><div id="tabs" class="tabs"></div><div id="levels" class="levels"></div></div><div class="stats"><span id="progressText"></span><div class="track"><div id="bar" class="bar"></div></div></div><div id="cards" class="cards"></div><div id="empty">No problems at this difficulty in this category. Try another filter.</div></section><p class="footer">Built for independent practice and whiteboard teamwork • Your progress stays on this device.</p></main><script>
const groups=[
{title:'Number Properties',problems:[['Mild','Find the GCF of 42 and 70.','14'],['Medium','Find the LCM of 9 and 15.','45'],['Spicy','Complete: 54 + 36 = 9(□ + □).','6 and 4'],['Spicy','Two lights flash every 12 seconds and 18 seconds. They flash together now. When will they next flash together?','36 seconds']]},
{title:'Fractions',problems:[['Mild','3/4 + 5/6','1 7/12'],['Medium','4 1/2 − 2 5/8','1 7/8'],['Medium','2 2/3 × 1 1/4','3 1/3'],['Spicy','5 1/4 ÷ 3/8','14'],['Spicy','A recipe uses 2/3 cup of flour per batch. How many batches can be made with 5 1/2 cups?','8 1/4 batches worth of flour; 8 complete batches'],['Spicy','□ ÷ 3/4 = 2 2/3','2']]},
{title:'Area & Composite Shapes',problems:[['Mild','Find the area of a triangle with base 14 cm and perpendicular height 9 cm.','63 cm²'],['Medium','Find the area of a parallelogram with base 11 ft, perpendicular height 7 ft, and slanted side 9 ft.','77 ft²'],['Medium','A trapezoid has bases of 8 m and 14 m and a height of 5 m. Find its area.','55 m²'],['Spicy','A 16 ft by 10 ft rectangle has a triangle removed. The triangle has base 8 ft and perpendicular height 6 ft. Find the remaining area.','136 ft²'],['Spicy','A composite figure joins a trapezoid (bases 6 ft and 12 ft, height 4 ft) to a triangle (base 6 ft, height 5 ft). Find the total area.','51 ft²']]},
{title:'ISAT Reasoning',problems:[['Medium','A student says 3/5 ÷ 2/3 = 6/15. Explain the error and give the correct answer.','They multiplied without taking the reciprocal of the divisor. Correct: 9/10.'],['Spicy','A trapezoid has bases 10 cm and 18 cm and a height of 6 cm. A student multiplies 18 × 6 and gets 108 cm². Explain why this is incorrect.','Both bases matter: (10 + 18) × 6 ÷ 2 = 84 cm².'],['Spicy','Which could represent an area? Select all: A. 12 cm; B. 24 ft²; C. 7 m³; D. 15 yd²; E. 9 in².','B, D, E'],['Spicy','A 12 ft by 8 ft rectangle has a triangular notch removed from one side. The notch has a vertical base of 6 ft and extends 4 ft into the rectangle. Find the remaining area and explain your method.','84 ft². Rectangle: 96 ft²; triangle: 12 ft²; subtract.']]}];
let category=-1,level='All';let completed={};try{completed=JSON.parse(localStorage.getItem('mathReviewCompleted')||'{}')}catch(e){}let revealed={};const $=id=>document.getElementById(id);function makeButton(label,active,click){let b=document.createElement('button');b.textContent=label;b.className=active?'active':'';b.onclick=click;return b}function render(){let tabs=$('tabs');tabs.replaceChildren();tabs.append(makeButton('All topics',category===-1,()=>{category=-1;render()}));groups.forEach((g,i)=>tabs.append(makeButton(g.title,category===i,()=>{category=i;render()})));let levels=$('levels');levels.replaceChildren();['All','Mild','Medium','Spicy'].forEach(v=>levels.append(makeButton(v,level===v,()=>{level=v;render()})));let all=groups.flatMap((g,i)=>g.problems.map((p,j)=>({p,id:i+'-'+j,topic:g.title})));let done=all.filter(x=>completed[x.id]).length;$('progressText').textContent=`${done} of ${all.length} problems completed`;$('bar').style.width=(100*done/all.length)+'%';let items=all.filter(x=>(category===-1||x.id.startsWith(category+'-'))&&(level==='All'||x.p[0]===level));$('empty').style.display=items.length?'none':'block';let root=$('cards');root.replaceChildren();items.forEach((x)=>{let c=document.createElement('article');c.className='card';let top=document.createElement('div');top.className='top';let n=document.createElement('span');n.className='num';n.textContent='#'+(all.findIndex(y=>y.id===x.id)+1);let tag=document.createElement('span');tag.className='tag '+x.p[0].toLowerCase();tag.textContent=x.p[0]+' • '+x.topic;top.append(n,tag);let q=document.createElement('div');q.className='question';q.textContent=x.p[1];c.append(top,q);if(revealed[x.id]){let a=document.createElement('div');a.className='answer';a.textContent='Answer: '+x.p[2];c.append(a)}let actions=document.createElement('div');actions.className='actions';actions.append(makeButton(revealed[x.id]?'Hide answer':'Reveal answer',false,()=>{revealed[x.id]=!revealed[x.id];render()}));let d=makeButton(completed[x.id]?'✓ Completed':'Mark complete',false,()=>{completed[x.id]=!completed[x.id];try{localStorage.setItem('mathReviewCompleted',JSON.stringify(completed))}catch(e){}render()});if(completed[x.id])d.className='done';actions.append(d);c.append(actions);root.append(c)})}render();
</script></body></html>
